<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel do Pastor — Gestão de Membros</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e2d45;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --success: #10b981;
    --danger: #ef4444;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.10) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(245,158,11,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* ── TELAS ── */
  .tela { display: none; }
  .tela.ativa { display: block; }

  /* ── LOGIN ── */
  #tela-login {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    position: relative;
    z-index: 1;
  }
  #tela-login.ativa { display: flex; }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.08);
    animation: fadeUp 0.5s ease;
    position: relative;
    overflow: hidden;
  }
  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-icon {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 1.2rem;
    filter: drop-shadow(0 4px 12px rgba(59,130,246,0.3));
  }
  .login-box h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #e2e8f0, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.3rem;
  }
  .login-box .subtitle {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .login-box .subtitle::before, .login-box .subtitle::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 50px;
  }

  .login-field { text-align: left; margin-bottom: 1rem; }
  .login-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  .login-field input::placeholder { color: var(--muted); }

  .login-erro {
    display: none;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    font-size: 0.82rem;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    text-align: left;
  }
  .login-erro.show { display: block; }

  .btn-login {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    letter-spacing: 0.3px;
  }
  .btn-login:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn-login:active { transform: scale(0.98); }

  .login-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 1.5rem;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.2);
    color: #fcd34d;
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 1rem;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-badge {
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.25);
    color: #fcd34d;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e2e8f0, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── MAIN ── */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1rem;
    position: relative;
    z-index: 1;
  }

  /* ── STATS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.azul::before { background: var(--accent); }
  .stat-card.ciano::before { background: var(--accent2); }
  .stat-card.ouro::before { background: var(--gold); }
  .stat-card.verde::before { background: var(--success); }
  .stat-card:hover { border-color: rgba(59,130,246,0.3); }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-card.azul .stat-num { color: var(--accent); }
  .stat-card.ciano .stat-num { color: var(--accent2); }
  .stat-card.ouro .stat-num { color: var(--gold); }
  .stat-card.verde .stat-num { color: var(--success); }
  .stat-lbl {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute; left: 0.9rem; top: 50%;
    transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }

  select.filtro {
    padding: 0.7rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select.filtro:focus { border-color: var(--accent); }
  select.filtro option { background: var(--surface2); }

  /* ── BUTTONS ── */
  .btn {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 0.7rem 1.2rem;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #2563eb); color: white; }
  .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
  .btn-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); }
  .btn-gold { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
  .btn-gold:hover { background: rgba(245,158,11,0.25); }
  .btn-sm { padding: 5px 11px; font-size: 0.72rem; border-radius: 7px; }

  /* ── TABELA ── */
  .table-wrap {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface2); }
  th {
    padding: 13px 14px;
    text-align: left;
    font-family: 'Syne', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.86rem; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(59,130,246,0.06); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge-membro { background: rgba(59,130,246,0.18); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
  .badge-congregado { background: rgba(245,158,11,0.18); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }

  .td-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 3.5rem 1rem;
    color: var(--muted);
  }
  .empty .e-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
  .empty p { font-size: 0.9rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.8rem 1.5rem;
    border-radius: 30px;
    font-size: 0.85rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── LOADING ── */
  .loading {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.8rem;
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    animation: fadeUp 0.3s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative;
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.3rem;
    gap: 1rem;
  }
  .modal-nome {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
  }
  .modal-tipo { margin-top: 4px; }

  .modal-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.8rem;
  }
  .modal-section-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  @media (max-width: 480px) { .modal-grid { grid-template-columns: 1fr; } }
  .modal-field strong {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .modal-field span {
    font-size: 0.88rem;
    color: var(--text);
  }

  /* ── PAGINAÇÃO ── */
  .paginacao {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .paginacao span { font-size: 0.82rem; color: var(--muted); }

  /* ── PRINT ── */
  @media print {
    body > *:not(#layout-impressao) { display: none !important; }
    #layout-impressao { display: block !important; position: absolute; left:0; top:0; width:210mm; padding:10mm; font-size:10px; color:black; background:white; box-sizing:border-box; }
    .pdf-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px; }
    .pdf-section { border:1px solid #333; padding:6px 8px; margin-bottom:6px; border-radius:4px; }
    .pdf-section-title { font-weight:bold; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:#555; margin-bottom:4px; }
    .pdf-field { margin-bottom:3px; }
  }
</style>
</head>
<body>

<!-- ── TELA LOGIN ── -->
<div id="tela-login" class="tela ativa">
  <div class="login-box">
    <span class="login-icon">🔐</span>
    <h1>Painel do Pastor</h1>
    <div class="subtitle">Área Restrita</div>

    <div id="login-erro" class="login-erro">❌ Senha incorreta. Tente novamente.</div>

    <div class="login-field">
      <label>Senha de acesso</label>
      <input type="password" id="senha-acesso" placeholder="Digite a senha" autofocus>
    </div>

    <button class="btn-login" onclick="fazerLogin()">🔓 Entrar no Painel</button>

    <div class="login-badge">🔒 Acesso exclusivo para o pastor</div>
  </div>
</div>

<!-- ── TELA PRINCIPAL ── -->
<div id="tela-principal" class="tela">

  <header>
    <div class="header-left">
      <span class="header-title">⛪ Gestão de Membros</span>
      <span class="header-badge">Pastor</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-gold btn-sm" onclick="exportarPDF()">📄 Exportar PDF</button>
      <button class="btn btn-danger btn-sm" onclick="sair()">Sair</button>
    </div>
  </header>

  <main>
    <!-- STATS -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card azul"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">Total</div></div>
      <div class="stat-card ciano"><div class="stat-num" id="stat-membros">—</div><div class="stat-lbl">Membros</div></div>
      <div class="stat-card ouro"><div class="stat-num" id="stat-congregados">—</div><div class="stat-lbl">Congregados</div></div>
      <div class="stat-card verde"><div class="stat-num" id="stat-mes">—</div><div class="stat-lbl">Este mês</div></div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar por nome, CPF ou e-mail…" oninput="renderLista()">
      </div>
      <select class="filtro" id="filtro-tipo" onchange="renderLista()">
        <option value="">Todos os tipos</option>
        <option value="Membro">Membros</option>
        <option value="Congregado">Congregados</option>
      </select>
      <select class="filtro" id="filtro-setor" onchange="renderLista()">
        <option value="">Todos os setores</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="carregarLista()">🔄 Atualizar</button>
    </div>

    <!-- TABELA -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>CPF</th>
            <th>Celular</th>
            <th>Setor</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-lista"></tbody>
      </table>
    </div>

    <!-- PAGINAÇÃO -->
    <div class="paginacao" id="paginacao"></div>

  </main>
</div>

<!-- MODAL DETALHES -->
<div class="overlay" id="modal-overlay" onclick="fecharModalClick(event)">
  <div class="modal" id="modal-conteudo"></div>
</div>

<!-- IMPRESSÃO -->
<div id="layout-impressao" style="display:none;"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── SUPABASE ──────────────────────────────────────────
const SUPABASE_URL = 'https://vclqdzvir nafwplivlfc.supabase.co'.replace(' ','');
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjbHFkenZpcm5hZndwbGl2bGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjY1ODIsImV4cCI6MjA5NDU0MjU4Mn0.KFl1WiE4TU20YfD6SRI57HTDJbnaUNsCn3zww8Usdqc';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'adbelavist@9';

let membrosCache = [];
let paginaAtual = 1;
const POR_PAGINA = 20;

// ── TOAST ─────────────────────────────────────────────
function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── LOGIN ─────────────────────────────────────────────
function fazerLogin() {
  const s = document.getElementById('senha-acesso').value;
  const erro = document.getElementById('login-erro');

  if (s === SENHA) {
    erro.classList.remove('show');
    document.getElementById('tela-login').classList.remove('ativa');
    document.getElementById('tela-principal').classList.add('ativa');
    carregarLista();
  } else {
    erro.classList.add('show');
    document.getElementById('senha-acesso').value = '';
    document.getElementById('senha-acesso').focus();
    // Shake animation
    const box = document.querySelector('.login-box');
    box.style.animation = 'none';
    box.offsetHeight;
    box.style.animation = 'shake 0.4s ease';
    setTimeout(() => box.style.animation = '', 500);
  }
}

function sair() {
  document.getElementById('tela-principal').classList.remove('ativa');
  document.getElementById('tela-login').classList.add('ativa');
  document.getElementById('senha-acesso').value = '';
  membrosCache = [];
}

// ── CARREGAR ──────────────────────────────────────────
async function carregarLista() {
  const corpo = document.getElementById('corpo-lista');
  corpo.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:2.5rem;">
    <span class="loading" style="border-color:rgba(100,116,139,0.3);border-top-color:var(--accent);"></span>
    <span style="margin-left:10px;">Carregando membros…</span>
  </td></tr>`;

  const { data, error } = await db.from('membros').select('*').order('nome');

  if (error) {
    toast('❌ Erro ao carregar membros.');
    corpo.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="e-icon">⚠️</div><p>Erro ao carregar. Verifique a conexão.</p></div></td></tr>`;
    return;
  }

  membrosCache = data || [];
  renderStats();
  popularFiltroSetor();
  renderLista();
}

function renderStats() {
  const total = membrosCache.length;
  const membros = membrosCache.filter(m => m.tipo_cadastro === 'Membro').length;
  const congregados = membrosCache.filter(m => m.tipo_cadastro === 'Congregado').length;

  const agora = new Date();
  const mes = agora.getMonth();
  const ano = agora.getFullYear();
  const doMes = membrosCache.filter(m => {
    if (!m.created_at) return false;
    const d = new Date(m.created_at);
    return d.getMonth() === mes && d.getFullYear() === ano;
  }).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-membros').textContent = membros;
  document.getElementById('stat-congregados').textContent = congregados;
  document.getElementById('stat-mes').textContent = doMes;
}

function popularFiltroSetor() {
  const setores = [...new Set(membrosCache.map(m => m.setor_igreja).filter(Boolean))].sort();
  const sel = document.getElementById('filtro-setor');
  const valorAtual = sel.value;
  sel.innerHTML = '<option value="">Todos os setores</option>';
  setores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    if (s === valorAtual) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderLista() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const filtroTipo = document.getElementById('filtro-tipo').value;
  const filtroSetor = document.getElementById('filtro-setor').value;

  const filtrados = membrosCache.filter(m => {
    const matchBusca = !busca ||
      m.nome.toLowerCase().includes(busca) ||
      (m.cpf||'').includes(busca) ||
      (m.email||'').toLowerCase().includes(busca) ||
      (m.celular||'').includes(busca);
    const matchTipo = !filtroTipo || m.tipo_cadastro === filtroTipo;
    const matchSetor = !filtroSetor || m.setor_igreja === filtroSetor;
    return matchBusca && matchTipo && matchSetor;
  });

  const corpo = document.getElementById('corpo-lista');
  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
  if (paginaAtual > totalPaginas) paginaAtual = 1;

  const inicio = (paginaAtual - 1) * POR_PAGINA;
  const pagina = filtrados.slice(inicio, inicio + POR_PAGINA);

  if (filtrados.length === 0) {
    corpo.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="e-icon">📭</div><p>Nenhum membro encontrado.</p></div></td></tr>`;
    document.getElementById('paginacao').innerHTML = '';
    return;
  }

  corpo.innerHTML = pagina.map((m, i) => `
    <tr>
      <td style="color:var(--muted);font-size:0.78rem;">${inicio + i + 1}</td>
      <td><strong style="font-size:0.9rem;">${m.nome}</strong></td>
      <td><span class="badge badge-${m.tipo_cadastro === 'Membro' ? 'membro' : 'congregado'}">${m.tipo_cadastro}</span></td>
      <td style="color:var(--muted);">${m.cpf || '—'}</td>
      <td>${m.celular || '—'}</td>
      <td style="color:var(--muted);font-size:0.82rem;">${m.setor_igreja || '—'}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-ghost btn-sm" onclick="verDetalhes('${m.id}')">👁 Ver</button>
          <button class="btn btn-ghost btn-sm" onclick="imprimirFicha('${m.id}')">🖨️</button>
          <button class="btn btn-danger btn-sm" onclick="excluirMembro('${m.id}', '${m.nome.replace(/'/g,"\\'")}')">✕</button>
        </div>
      </td>
    </tr>
  `).join('');

  // Paginação
  const pag = document.getElementById('paginacao');
  if (totalPaginas <= 1) { pag.innerHTML = `<span>${filtrados.length} registros</span>`; return; }

  let html = `<span>${filtrados.length} registros</span>`;
  html += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${paginaAtual-1})" ${paginaAtual===1?'disabled':''}>‹</button>`;
  for (let p = 1; p <= totalPaginas; p++) {
    if (p === paginaAtual)
      html += `<button class="btn btn-primary btn-sm">${p}</button>`;
    else if (p === 1 || p === totalPaginas || Math.abs(p - paginaAtual) <= 1)
      html += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${p})">${p}</button>`;
    else if (Math.abs(p - paginaAtual) === 2)
      html += `<span>…</span>`;
  }
  html += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${paginaAtual+1})" ${paginaAtual===totalPaginas?'disabled':''}>›</button>`;
  pag.innerHTML = html;
}

function mudarPagina(p) {
  paginaAtual = p;
  renderLista();
  document.querySelector('.table-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fecharModalClick(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ── EXCLUIR ───────────────────────────────────────────
async function excluirMembro(id, nome) {
  if (!confirm(`Excluir "${nome}" permanentemente? Esta ação não pode ser desfeita.`)) return;

  const { error } = await db.from('membros').delete().eq('id', id);
  if (error) { toast('❌ Erro ao excluir.'); return; }

  membrosCache = membrosCache.filter(m => m.id !== id);
  renderStats();
  popularFiltroSetor();
  renderLista();
  toast('🗑️ Membro excluído com sucesso.');
}

// ── PDF LISTA ─────────────────────────────────────────
function exportarPDF() {
  if (membrosCache.length === 0) { toast('⚠️ Nenhum membro para exportar.'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFillColor(17, 24, 39);
  doc.rect(0, 0, 210, 38, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('LISTA DE MEMBROS — 2026', 105, 15, { align: 'center' });
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.setTextColor(148,163,184);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')} · Total: ${membrosCache.length} registros`, 105, 27, { align: 'center' });

  const rows = membrosCache.map((m, i) => [
    i + 1,
    m.nome,
    m.tipo_cadastro,
    m.cpf || '—',
    m.celular || '—',
    m.email || '—',
    m.setor_igreja || '—'
  ]);

  doc.autoTable({
    head: [['#', 'Nome', 'Tipo', 'CPF', 'Celular', 'E-mail', 'Setor']],
    body: rows,
    startY: 44,
    styles: { font: 'helvetica', fontSize: 7.5, cellPadding: 4 },
    headStyles: { fillColor: [37,99,235], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [248,250,252] },
    columnStyles: { 0: { cellWidth: 8 } }
  });

  doc.save('membros_igreja_2026.pdf');
  toast('📄 PDF gerado com sucesso!');
}
