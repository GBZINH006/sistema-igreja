<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel do Pastor</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg:#0a0f1e; --surface:#111827; --surface2:#1a2236; --border:#1e2d45;
    --accent:#3b82f6; --accent2:#06b6d4; --gold:#f59e0b;
    --text:#e2e8f0; --muted:#64748b; --success:#10b981; --danger:#ef4444; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,0.10) 0%,transparent 70%);pointer-events:none;z-index:0;}

  /* ── NOTIFICAÇÃO NOVA ──────────────────────────────── */
  #notif-stack {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 9999;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    max-width: 340px;
  }

  .notif-card {
    background: var(--surface);
    border: 1px solid rgba(16,185,129,0.4);
    border-left: 4px solid var(--success);
    border-radius: 14px;
    padding: 1rem 1.2rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(16,185,129,0.08);
    animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }
  .notif-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--success), var(--accent2));
    animation: progress 6s linear forwards;
  }
  @keyframes progress {
    from { width: 100%; } to { width: 0%; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(60px) scale(0.92); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  .notif-saindo {
    animation: slideOut 0.3s ease forwards !important;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(60px) scale(0.92); }
  }
  .notif-topo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .notif-pulse {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100%{ box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
    50%{ box-shadow: 0 0 0 6px rgba(16,185,129,0); }
  }
  .notif-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--success);
    flex: 1;
  }
  .notif-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.85rem;
    padding: 0 2px; line-height: 1;
    transition: color 0.2s;
  }
  .notif-close:hover { color: var(--text); }
  .notif-nome {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 3px;
  }
  .notif-meta {
    font-size: 0.76rem;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .notif-meta span {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
  }
  .notif-acoes {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .notif-btn {
    font-size: 0.72rem; font-family: 'Syne', sans-serif; font-weight: 700;
    padding: 4px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .notif-btn:hover { border-color: var(--accent); }
  .notif-btn.verde {
    background: rgba(16,185,129,0.12);
    border-color: rgba(16,185,129,0.3);
    color: #6ee7b7;
  }
  .notif-btn.verde:hover { background: rgba(16,185,129,0.22); }

  /* ── BADGE SINO ────────────────────────────────────── */
  #sino-wrap {
    position: relative;
    cursor: pointer;
  }
  #sino-badge {
    display: none;
    position: absolute;
    top: -4px; right: -4px;
    background: var(--danger);
    color: white;
    font-size: 0.6rem;
    font-weight: 700;
    width: 16px; height: 16px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
  }
  #sino-badge.visivel { display: flex; }

  /* ── HEADER ────────────────────────────────────────── */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:1rem;}
  .header-left{display:flex;align-items:center;gap:10px;}
  .header-badge{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.25);color:#fcd34d;font-size:0.65rem;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:6px;text-transform:uppercase;}
  .header-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;background:linear-gradient(135deg,#e2e8f0,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .realtime-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite;}

  main{max-width:1000px;margin:0 auto;padding:2rem 1rem;position:relative;z-index:1;}

  /* ── STATS ─────────────────────────────────────────── */
  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.2rem;}
  @media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
  .stat-card.azul::before{background:var(--accent);}
  .stat-card.ciano::before{background:var(--accent2);}
  .stat-card.ouro::before{background:var(--gold);}
  .stat-card.verde::before{background:var(--success);}
  .stat-card.roxo::before{background:#a855f7;}
  .stat-num{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;line-height:1;margin-bottom:3px;transition:transform 0.3s ease;}
  .stat-num.bump { animation: bump 0.4s ease; }
  @keyframes bump { 50% { transform: scale(1.3); } }
  .stat-card.azul .stat-num{color:var(--accent);}
  .stat-card.ciano .stat-num{color:var(--accent2);}
  .stat-card.ouro .stat-num{color:var(--gold);}
  .stat-card.verde .stat-num{color:var(--success);}
  .stat-card.roxo .stat-num{color:#a855f7;}
  .stat-lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}

  /* ── ANIVERSARIANTES ───────────────────────────────── */
  .aniv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.2rem;overflow:hidden;}
  .aniv-header{padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--border);}
  .aniv-header:hover{background:rgba(59,130,246,0.04);}
  .aniv-title{font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#f59e0b;display:flex;align-items:center;gap:8px;}
  .aniv-body{padding:0.8rem 1.2rem;max-height:280px;overflow-y:auto;}
  .aniv-body.fechado{display:none;}
  .aniv-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .aniv-item:last-child{border-bottom:none;}
  .aniv-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .aniv-avatar-placeholder{width:36px;height:36px;border-radius:50%;background:rgba(245,158,11,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .aniv-info{flex:1;}
  .aniv-nome{font-size:0.88rem;font-weight:600;}
  .aniv-sub{font-size:0.72rem;color:var(--muted);}
  .hoje-badge{background:rgba(245,158,11,0.2);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);font-size:0.65rem;padding:2px 7px;border-radius:10px;font-weight:700;}

  /* ── TOOLBAR ───────────────────────────────────────── */
  .toolbar{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap input{width:100%;padding:0.7rem 1rem 0.7rem 2.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.2s;}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap input::placeholder{color:var(--muted);}
  .search-icon{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  select.filtro{padding:0.7rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;outline:none;cursor:pointer;}
  select.filtro option{background:var(--surface2);}

  /* ── BOTÕES ────────────────────────────────────────── */
  .btn{cursor:pointer;border:none;border-radius:10px;padding:0.7rem 1.2rem;font-family:'Syne',sans-serif;font-weight:700;font-size:0.82rem;letter-spacing:0.5px;transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#2563eb);color:white;}
  .btn-primary:hover{filter:brightness(1.15);box-shadow:0 4px 20px rgba(59,130,246,0.4);}
  .btn-danger{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
  .btn-danger:hover{background:rgba(239,68,68,0.2);}
  .btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-gold{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:#fcd34d;}
  .btn-gold:hover{background:rgba(245,158,11,0.25);}
  .btn-green{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;}
  .btn-green:hover{background:rgba(16,185,129,0.25);}
  .btn-sm{padding:5px 11px;font-size:0.72rem;border-radius:7px;}

  /* ── TABELA ────────────────────────────────────────── */
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.2);}
  table{width:100%;border-collapse:collapse;}
  thead{background:var(--surface2);}
  th{padding:12px 14px;text-align:left;font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.86rem;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.15s;}
  tbody tr:hover{background:rgba(59,130,246,0.06);}
  tr.novo-destaque { animation: destacar 2.5s ease; }
  @keyframes destacar {
    0%,20%{ background: rgba(16,185,129,0.12); }
    100%{ background: transparent; }
  }

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;}
  .badge-membro{background:rgba(59,130,246,0.18);color:#93c5fd;border:1px solid rgba(59,130,246,0.3);}
  .badge-congregado{background:rgba(245,158,11,0.18);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);}
  .badge-ativo{background:rgba(16,185,129,0.18);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);}
  .badge-inativo{background:rgba(100,116,139,0.18);color:#94a3b8;border:1px solid rgba(100,116,139,0.3);}
  .badge-transferido{background:rgba(245,158,11,0.18);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);}
  .badge-falecido{background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);}
  .td-actions{display:flex;gap:5px;flex-wrap:wrap;}

  /* ── PAGINAÇÃO ─────────────────────────────────────── */
  .paginacao{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:1.2rem;flex-wrap:wrap;}
  .paginacao span{font-size:0.82rem;color:var(--muted);}

  /* ── EMPTY ─────────────────────────────────────────── */
  .empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
  .empty .e-icon{font-size:3rem;margin-bottom:1rem;opacity:0.3;}

  /* ── TOAST ─────────────────────────────────────────── */
  #toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.8rem 1.5rem;border-radius:30px;font-size:0.85rem;box-shadow:0 8px 30px rgba(0,0,0,0.4);z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
  #toast.show{transform:translateX(-50%) translateY(0);}

  .loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  /* ── MODAIS ────────────────────────────────────────── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:200;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.8rem;width:100%;max-width:660px;animation:fadeUp 0.3s ease;box-shadow:0 30px 80px rgba(0,0,0,0.5);position:relative;margin:auto;}
  .modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.2rem;gap:1rem;}
  .modal-nome{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--text);line-height:1.3;}
  .modal-section{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:0.8rem;}
  .modal-section-title{font-family:'Syne',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:0.8rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}
  @media(max-width:480px){.modal-grid{grid-template-columns:1fr;}}
  .modal-field strong{display:block;font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:2px;}
  .modal-field span{font-size:0.88rem;color:var(--text);}
  .foto-modal-grande{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-right:1rem;flex-shrink:0;}

  /* ── EDIÇÃO ────────────────────────────────────────── */
  .edit-input{width:100%;padding:0.65rem 0.9rem;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.87rem;outline:none;transition:border-color 0.2s;margin-top:3px;}
  .edit-input:focus{border-color:var(--accent);}
  .edit-input::placeholder{color:var(--muted);}
  .edit-label{display:block;font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:0.8rem;margin-bottom:2px;}
  .edit-row{display:grid;gap:10px;}
  .edit-col2{grid-template-columns:1fr 1fr;}
  .edit-col3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:560px){.edit-col2,.edit-col3{grid-template-columns:1fr;}}
  .edit-radio{display:flex;gap:1rem;margin-top:6px;align-items:center;}
  .edit-radio label{display:flex;align-items:center;gap:5px;font-size:0.88rem;cursor:pointer;}
  .edit-radio input[type=radio]{width:15px;height:15px;margin:0;accent-color:var(--accent);}
  .edit-section{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:0.8rem;}
  .edit-section-title{font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:0.8rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);}
  .foto-edit-area{border:2px dashed var(--border);border-radius:12px;padding:1rem;text-align:center;background:var(--surface2);margin-top:4px;}
  .foto-edit-area.tem-foto{border-color:var(--success);border-style:solid;}
  .foto-edit-preview{width:70px;height:70px;border-radius:50%;object-fit:cover;margin:0 auto 0.5rem;display:block;border:2px solid var(--success);}
  .doc-edit-preview{width:100%;max-height:90px;object-fit:contain;border-radius:6px;margin:0.4rem 0;display:block;}
  .foto-edit-btns{display:flex;gap:6px;justify-content:center;margin-top:0.6rem;}
  .btn-foto-edit{cursor:pointer;border:1px solid var(--border);border-radius:7px;padding:4px 11px;background:var(--surface);color:var(--text);font-size:0.75rem;transition:all 0.2s;}
  .btn-foto-edit:hover{border-color:var(--accent);}

  @media print{body>*:not(#layout-impressao){display:none!important;}#layout-impressao{display:block!important;position:absolute;left:0;top:0;width:210mm;padding:10mm;font-size:10px;color:black;background:white;box-sizing:border-box;}.pdf-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px;}.pdf-section{border:1px solid #333;padding:6px 8px;margin-bottom:6px;border-radius:4px;}.pdf-section-title{font-weight:bold;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:4px;}.pdf-field{margin-bottom:3px;}}
</style>
</head>
<body>

<!-- ── PAINEL PRINCIPAL ─────────────────────────────── -->
<header>
  <div class="header-left">
    <span class="header-title">⛪ Gestão de Membros</span>
    <span class="header-badge">Pastor</span>
    <span class="realtime-dot" title="Conexão em tempo real ativa"></span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <!-- SINO DE NOTIFICAÇÕES -->
    <div id="sino-wrap" onclick="abrirHistoricoNotif()" title="Notificações de novos membros">
      <button class="btn btn-ghost btn-sm">🔔</button>
      <span id="sino-badge">0</span>
    </div>
    <button class="btn btn-gold btn-sm" onclick="exportarPDF()">📄 PDF</button>
    <button class="btn btn-ghost btn-sm" onclick="carregarLista()">🔄</button>
  </div>
</header>

<main>
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card azul"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card ciano"><div class="stat-num" id="stat-membros">—</div><div class="stat-lbl">Membros</div></div>
    <div class="stat-card ouro"><div class="stat-num" id="stat-congregados">—</div><div class="stat-lbl">Congregados</div></div>
    <div class="stat-card verde"><div class="stat-num" id="stat-ativos">—</div><div class="stat-lbl">Ativos</div></div>
    <div class="stat-card roxo"><div class="stat-num" id="stat-mes">—</div><div class="stat-lbl">Este mês</div></div>
  </div>

  <!-- ANIVERSARIANTES -->
  <div class="aniv-card">

function criarNotificacao(membro) {

// ── FOTOS ──────────────────────────────────────────────
async function comprimirImagem(file, maxDim=900) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, maxDim / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.82);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadFotoAdmin(file, pasta) {
  if (!file) return null;
  try {
    const blob = await comprimirImagem(file);
    const path = `${pasta}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    const { error } = await db.storage.from('membros').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if (error) { console.warn('Storage:', error.message); return null; }
    return db.storage.from('membros').getPublicUrl(path).data.publicUrl;
  } catch(e) { console.warn(e); return null; }
}
function editPreviewFoto(input, previewId, placeholderId, areaId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById(previewId);
    prev.src = e.target.result;
    prev.style.display = 'block';
    document.getElementById(placeholderId).style.display = 'none';
    document.getElementById(areaId).classList.add('tem-foto');
  };
  reader.readAsDataURL(file);
}

  corpo.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2.5rem;"><span class="loading" style="border-color:rgba(100,116,139,0.3);border-top-color:var(--accent);"></span><span style="margin-left:10px;">Carregando…</span></td></tr>`;

  const { data, error } = await db.from('membros').select('*').order('nome');

  if (error) {
    toast('❌ Erro ao carregar.');
    corpo.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem;">Erro de conexão com o banco.</td></tr>`;
    return;
  }

  membrosCache = data || [];
  primeiraLeitura = false; // a partir de agora, novos INSERTs serão notificados
  renderStats();
  popularFiltroSetor();
  renderAniversariantes();
  renderLista();
}

function renderStats(animarTotal = false) {
  const total = membrosCache.length;
  const membros = membrosCache.filter(m => m.tipo_cadastro === 'Membro').length;
  const congregados = membrosCache.filter(m => m.tipo_cadastro === 'Congregado').length;
  const ativos = membrosCache.filter(m => !m.status || m.status === 'Ativo').length;
  const agora = new Date();
  const doMes = membrosCache.filter(m => {
    if (!m.created_at) return false;
    const d = new Date(m.created_at);
    return d.getMonth() === agora.getMonth() && d.getFullYear() === agora.getFullYear();
  }).length;

  const setNum = (id, val) => {
    const el = document.getElementById(id);
    if (el.textContent !== String(val)) {
      el.textContent = val;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  };
  setNum('stat-total', total);
  setNum('stat-membros', membros);
  setNum('stat-congregados', congregados);
  setNum('stat-ativos', ativos);
  setNum('stat-mes', doMes);
}

function popularFiltroSetor() {
  const setores = [...new Set(membrosCache.map(m => m.setor_igreja).filter(Boolean))].sort();
  const sel = document.getElementById('filtro-setor');
  const val = sel.value;
  sel.innerHTML = '<option value="">Todos os setores</option>';
  setores.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; if (s === val) o.selected = true; sel.appendChild(o); });
}

// ── ANIVERSARIANTES ────────────────────────────────────
function toggleAniv() {
  anivAberto = !anivAberto;
  document.getElementById('aniv-body').classList.toggle('fechado', !anivAberto);
  document.getElementById('aniv-chevron').textContent = anivAberto ? '▼' : '▶';
}

function renderAniversariantes() {
  const agora = new Date();
  const mesAtual = agora.getMonth();
  const hoje = agora.getDate();
  const lista = membrosCache
    .filter(m => m.data_nasc && (!m.status || m.status === 'Ativo'))
    .map(m => { const d = new Date(m.data_nasc); return { ...m, dia: d.getDate(), mes: d.getMonth(), ano: d.getFullYear() }; })
    .filter(m => m.mes === mesAtual)
    .sort((a, b) => a.dia - b.dia);

  const cnt = document.getElementById('aniv-count');
  cnt.textContent = lista.length;
  cnt.style.display = lista.length ? '' : 'none';

  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const body = document.getElementById('aniv-body');
  if (lista.length === 0) {
    body.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0;text-align:center;">Nenhum aniversariante este mês 🎉</div>';
    return;
  }
  body.innerHTML = lista.map(m => {
    const eHoje = m.dia === hoje;
    const idade = agora.getFullYear() - m.ano;
    const tel = m.celular ? m.celular.replace(/\D/g,'') : null;
    return `<div class="aniv-item" style="${eHoje?'background:rgba(245,158,11,0.06);border-radius:8px;padding:8px;':''}">
      ${m.foto_url ? `<img src="${m.foto_url}" class="aniv-avatar">` : `<div class="aniv-avatar-placeholder">🎂</div>`}
      <div class="aniv-info">
        <div class="aniv-nome">${m.nome} ${eHoje ? '<span class="hoje-badge">HOJE!</span>' : ''}</div>
        <div class="aniv-sub">Dia ${m.dia} de ${meses[mesAtual]} · ${idade} anos</div>
      </div>
      ${tel ? `<a href="https://wa.me/55${tel}?text=Feliz+aniversário+${encodeURIComponent(m.nome.split(' ')[0])}!+Que+Deus+te+abençoe+muito!" target="_blank" class="btn btn-gold btn-sm" style="text-decoration:none;">🎉 Parabenizar</a>` : ''}
    </div>`;
  }).join('');
}

// ── RENDER LISTA ───────────────────────────────────────
function renderLista(novoId = null) {
  const busca = document.getElementById('busca').value.toLowerCase();
  const filtroTipo = document.getElementById('filtro-tipo').value;
  const filtroStatus = document.getElementById('filtro-status').value;
  const filtroSetor = document.getElementById('filtro-setor').value;

  const filtrados = membrosCache.filter(m => {
    const matchBusca = !busca || m.nome.toLowerCase().includes(busca) || (m.cpf||'').includes(busca) || (m.celular||'').includes(busca) || (m.email||'').toLowerCase().includes(busca);
    const matchTipo = !filtroTipo || m.tipo_cadastro === filtroTipo;
    const matchStatus = !filtroStatus || (m.status || 'Ativo') === filtroStatus;
    const matchSetor = !filtroSetor || m.setor_igreja === filtroSetor;
    return matchBusca && matchTipo && matchStatus && matchSetor;
  });

  const corpo = document.getElementById('corpo-lista');
  const totalPag = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
  if (paginaAtual > totalPag) paginaAtual = 1;
  const inicio = (paginaAtual - 1) * POR_PAGINA;
  const pagina = filtrados.slice(inicio, inicio + POR_PAGINA);

  if (filtrados.length === 0) {
    corpo.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="e-icon">📭</div><p>Nenhum membro encontrado.</p></div></td></tr>`;
    document.getElementById('paginacao').innerHTML = '';
    return;
  }

  corpo.innerHTML = pagina.map(m => `
    <tr id="row-${m.id}" class="${m.id === novoId ? 'novo-destaque' : ''}">
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          ${avatarImg(m, 32)}
          <div>
            <strong style="font-size:0.88rem;">${m.nome}</strong>
            <div style="font-size:0.72rem;color:var(--muted);">${m.cpf||'—'}</div>
          </div>
        </div>
      </td>
      <td><span class="badge badge-${m.tipo_cadastro==='Membro'?'membro':'congregado'}">${m.tipo_cadastro}</span></td>
      <td>${statusBadge(m.status)}</td>
      <td style="font-size:0.85rem;">${m.celular||'—'}</td>
      <td style="color:var(--muted);font-size:0.8rem;">${m.setor_igreja||'—'}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-ghost btn-sm" onclick="verDetalhes('${m.id}')">👁</button>
          <button class="btn btn-ghost btn-sm" onclick="abrirEdicao('${m.id}')">✏️</button>
          ${whatsappLink(m.celular)}
          <button class="btn btn-danger btn-sm" onclick="excluirMembro('${m.id}','${m.nome.replace(/'/g,"\\'")}')">✕</button>
        </div>
      </td>
    </tr>
  `).join('');

  const pag = document.getElementById('paginacao');
  if (totalPag <= 1) { pag.innerHTML = `<span>${filtrados.length} registros</span>`; return; }
  let h = `<span>${filtrados.length} registros</span>`;
  h += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${paginaAtual-1})" ${paginaAtual===1?'disabled':''}>‹</button>`;
  for (let p = 1; p <= totalPag; p++) {
    if (p === paginaAtual) h += `<button class="btn btn-primary btn-sm">${p}</button>`;
    else if (p===1||p===totalPag||Math.abs(p-paginaAtual)<=1) h += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${p})">${p}</button>`;
    else if (Math.abs(p-paginaAtual)===2) h += `<span>…</span>`;
  }
  h += `<button class="btn btn-ghost btn-sm" onclick="mudarPagina(${paginaAtual+1})" ${paginaAtual===totalPag?'disabled':''}>›</button>`;
  pag.innerHTML = h;
}

function mudarPagina(p) { paginaAtual = p; renderLista(); document.querySelector('.table-wrap')?.scrollIntoView({behavior:'smooth',block:'start'}); }

  document.querySelectorAll('input[name="edit-sexo"]').forEach(r => r.checked = (r.value === (m.sexo||'M')));

  const prevFoto = document.getElementById('edit-preview-foto');
  const prevDoc = document.getElementById('edit-preview-doc');
  if (m.foto_url) { prevFoto.src = m.foto_url; prevFoto.style.display = 'block'; document.getElementById('edit-placeholder-foto').style.display = 'none'; document.getElementById('edit-area-foto').classList.add('tem-foto'); }
  else { prevFoto.style.display = 'none'; document.getElementById('edit-placeholder-foto').style.display = ''; document.getElementById('edit-area-foto').classList.remove('tem-foto'); }

}

async function salvarEdicao() {
  const id = document.getElementById('edit-id').value;
  const nome = document.getElementById('edit-nome').value.trim();
  if (!nome) { toast('⚠️ Nome obrigatório!'); return; }

  const btn = document.getElementById('btn-salvar-edit');
  btn.innerHTML = '<span class="loading"></span> Salvando…';
  btn.disabled = true;

  const fotoInput = document.getElementById('edit-input-foto');
  const docInput = document.getElementById('edit-input-doc');
  const [novaFoto, novaDoc] = await Promise.all([
    fotoInput.files[0] ? uploadFotoAdmin(fotoInput.files[0], 'fotos') : Promise.resolve(null),
    docInput.files[0] ? uploadFotoAdmin(docInput.files[0], 'docs') : Promise.resolve(null),
  ]);

  const mAtual = membrosCache.find(x => x.id === id);
  const dados = {
    tipo_cadastro: document.querySelector('input[name="edit-tipo"]:checked')?.value || 'Membro',
    status: document.getElementById('edit-status').value,
    nome, rg: document.getElementById('edit-rg').value,
    cpf: document.getElementById('edit-cpf').value,
    data_nasc: document.getElementById('edit-nasc').value || null,
    idade: parseInt(document.getElementById('edit-idade').value) || null,
    sexo: document.querySelector('input[name="edit-sexo"]:checked')?.value || 'M',
    tipo_sanguineo: document.getElementById('edit-sangue').value,
    escolaridade: document.getElementById('edit-esc').value,
    estado_civil: document.getElementById('edit-civil').value,
    conjuge_nome: document.getElementById('edit-conjuge').value,
    data_casamento: document.getElementById('edit-casamento').value || null,
    cep: document.getElementById('edit-cep').value,
    bairro: document.getElementById('edit-bairro').value,
    endereco: document.getElementById('edit-endereco').value,
    cidade_estado: document.getElementById('edit-cidade').value,
    fone_res: document.getElementById('edit-fone-res').value,
    fone_com: document.getElementById('edit-fone-com').value,
    celular: document.getElementById('edit-celular').value,
    email: document.getElementById('edit-email').value,
    forma_recebimento: document.getElementById('edit-recebimento').value,
    cargo_principal: document.getElementById('edit-cargo').value,
    setor_igreja: document.getElementById('edit-setor').value,
    congregacao_igreja: document.getElementById('edit-congregacao').value,
    data_batismo_aguas: document.getElementById('edit-bat-aguas').value || null,
    data_batismo_es: document.getElementById('edit-bat-es').value || null,
    data_aprovacao: document.getElementById('edit-aprovacao').value || null,
    qtd_filhos: parseInt(document.getElementById('edit-filhos').value) || 0,
    nome_dep1: document.getElementById('edit-dep1-nome').value,
    parentesco_dep1: document.getElementById('edit-dep1-par').value,
    nome_dep2: document.getElementById('edit-dep2-nome').value,
    parentesco_dep2: document.getElementById('edit-dep2-par').value,
    foto_url: novaFoto || (mAtual ? mAtual.foto_url : null),
    doc_url: novaDoc || (mAtual ? mAtual.doc_url : null),
  };

  const { error } = await db.from('membros').update(dados).eq('id', id);
  btn.innerHTML = '💾 Salvar Alterações';
  btn.disabled = false;

  if (error) { toast('❌ Erro ao salvar.'); return; }

  const idx = membrosCache.findIndex(x => x.id === id);
  if (idx !== -1) membrosCache[idx] = { ...membrosCache[idx], ...dados };
  renderStats(); popularFiltroSetor(); renderAniversariantes(); renderLista();
  document.getElementById('edit-overlay').classList.remove('open');
  toast('✅ Cadastro atualizado!');
}

// ── EXCLUIR ────────────────────────────────────────────
async function excluirMembro(id, nome) {
  if (!confirm(`Excluir "${nome}" permanentemente?`)) return;
  const { error } = await db.from('membros').delete().eq('id', id);
  if (error) { toast('❌ Erro ao excluir.'); return; }
  membrosCache = membrosCache.filter(m => m.id !== id);
  renderStats(); popularFiltroSetor(); renderAniversariantes(); renderLista();
  toast('🗑️ Membro excluído.');
}

function fecharOverlayClick(e, id) {
  if (e.target === document.getElementById(id))
    document.getElementById(id).classList.remove('open');
}

// ── PDF ────────────────────────────────────────────────
function exportarPDF() {
  if (membrosCache.length === 0) { toast('⚠️ Nenhum membro.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(17,24,39); doc.rect(0,0,210,38,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('LISTA DE MEMBROS — 2026',105,15,{align:'center'});
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(148,163,184);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')} · Total: ${membrosCache.length}`,105,27,{align:'center'});
  const rows = membrosCache.map((m,i)=>[i+1,m.nome,m.tipo_cadastro,m.status||'Ativo',m.cpf||'—',m.celular||'—',m.setor_igreja||'—']);
  doc.autoTable({head:[['#','Nome','Tipo','Status','CPF','Celular','Setor']],body:rows,startY:44,styles:{font:'helvetica',fontSize:7.5,cellPadding:4},headStyles:{fillColor:[37,99,235],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[248,250,252]},columnStyles:{0:{cellWidth:8}}});
  doc.save('membros_igreja_2026.pdf');
  toast('📄 PDF gerado!');
}

// ── IMPRIMIR FICHA ─────────────────────────────────────

  const m = membrosCache.find(x => x.id === id);
  if (!m) return;
  const f = v => v || '—';
  const fd = v => v ? v.split('-').reverse().join('/') : '—';
  document.getElementById('layout-impressao').innerHTML = `
    <div class="pdf-header">
      <div><div style="font-size:14px;font-weight:bold;">FICHA CADASTRAL — ${f(m.tipo_cadastro).toUpperCase()}</div>

      <div class="pdf-field"><strong>Batismo Águas:</strong> ${fd(m.data_batismo_aguas)} | <strong>Batismo ES:</strong> ${fd(m.data_batismo_es)} | <strong>Cargo:</strong> ${f(m.cargo_principal)}</div>

}
