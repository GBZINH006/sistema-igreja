<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Em Atualização</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070b16;
  --card:#111827;
  --border:#1e293b;
  --accent:#3b82f6;
  --accent2:#06b6d4;
  --text:#e2e8f0;
  --muted:#94a3b8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  font-family:'DM Sans', sans-serif;
  color:var(--text);
  position:relative;
}

/* FUNDO */
.bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.blur{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  opacity:.35;
  animation:float 8s ease-in-out infinite;
}

.blur1{
  width:350px;
  height:350px;
  background:#3b82f6;
  top:-100px;
  left:-100px;
}

.blur2{
  width:300px;
  height:300px;
  background:#06b6d4;
  bottom:-120px;
  right:-80px;
  animation-delay:2s;
}

.blur3{
  width:200px;
  height:200px;
  background:#2563eb;
  top:40%;
  left:60%;
  animation-delay:4s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0px) translateX(0px);
  }
  50%{
    transform:translateY(-20px) translateX(10px);
  }
}

/* CARD */
.container{
  position:relative;
  z-index:2;
  width:90%;
  max-width:600px;
  padding:3rem 2rem;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(17,24,39,.75);
  backdrop-filter:blur(18px);
  border-radius:28px;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
  animation:fadeUp 1s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ICON */
.icon{
  font-size:5rem;
  margin-bottom:1rem;
  animation:bounce 2s infinite;
  display:inline-block;
}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

/* TITULO */
.title{
  font-family:'Syne', sans-serif;
  font-size:2.3rem;
  font-weight:800;
  margin-bottom:1rem;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TEXTO */
.text{
  color:var(--muted);
  line-height:1.8;
  font-size:1rem;
  margin-bottom:2rem;
}

/* STATUS */
.status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:.8rem 1.2rem;
  border-radius:999px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  color:var(--text);
  font-size:.9rem;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#f59e0b;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%{
    transform:scale(1);
    opacity:1;
  }
  50%{
    transform:scale(1.5);
    opacity:.5;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* PARTICULAS */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  opacity:.2;
  animation:particleMove linear infinite;
}

@keyframes particleMove{
  from{
    transform:translateY(100vh);
  }
  to{
    transform:translateY(-100vh);
  }
}

@media(max-width:600px){

  .container{
    padding:2.5rem 1.5rem;
  }

  .title{
    font-size:1.8rem;
  }

  .text{
    font-size:.95rem;
  }

  .icon{
    font-size:4rem;
  }

}
</style>
</head>
<body>

<div class="bg">
  <div class="blur blur1"></div>
  <div class="blur blur2"></div>
  <div class="blur blur3"></div>
</div>

<div class="container">

  <img src="images.png" alt="" class="icon">

  <h1 class="title">
    Estamos em atualização
  </h1>

  <p class="text">
    Nosso sistema de cadastro está temporariamente indisponível.<br><br>

    Estamos realizando melhorias para deixar tudo mais rápido, moderno e seguro ⚡<br><br>

    Volte novamente mais tarde 😉
  </p>

  <div class="status">
    <span class="dot"></span>
    Atualização em andamento...
  </div>

</div>

<script>
/* PARTICULAS */
for(let i = 0; i < 35; i++){

  const particle = document.createElement('div')

  particle.classList.add('particle')

  particle.style.left = Math.random() * 100 + 'vw'

  particle.style.animationDuration =
    (Math.random() * 10 + 5) + 's'

  particle.style.opacity =
    Math.random()

  particle.style.width =
    particle.style.height =
    (Math.random() * 4 + 2) + 'px'

  document.body.appendChild(particle)

}
</script>

</body>
</html>
