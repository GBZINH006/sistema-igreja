<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manual visual da ficha publica</title>
  <desc id="desc">Resumo das etapas da ficha publica: tipo, dados, documentos, assinatura e envio.</desc>
  <rect width="1200" height="720" rx="36" fill="#eef3f8"/>
  <rect x="60" y="64" width="1080" height="592" rx="30" fill="#ffffff" stroke="#d8e3f0"/>
  <rect x="60" y="64" width="270" height="592" rx="30" fill="#0f172a"/>
  <circle cx="134" cy="142" r="42" fill="#0f766e"/>
  <text x="134" y="153" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#ffffff">AD</text>
  <text x="102" y="220" font-family="Arial" font-size="30" font-weight="800" fill="#ffffff">Ficha publica</text>
  <text x="102" y="254" font-family="Arial" font-size="17" fill="#cbd5e1">Cadastro de membro ou congregado</text>
  <g font-family="Arial" font-size="18" font-weight="700" fill="#e2e8f0">
    <rect x="96" y="318" width="198" height="52" rx="14" fill="#1d4ed8"/>
    <text x="124" y="351">1. Tipo</text>
    <rect x="96" y="386" width="198" height="52" rx="14" fill="#1e293b"/>
    <text x="124" y="419">2. Dados</text>
    <rect x="96" y="454" width="198" height="52" rx="14" fill="#1e293b"/>
    <text x="124" y="487">3. Documentos</text>
    <rect x="96" y="522" width="198" height="52" rx="14" fill="#1e293b"/>
    <text x="124" y="555">4. Assinatura</text>
  </g>
  <text x="390" y="144" font-family="Arial" font-size="34" font-weight="800" fill="#0f172a">Como preencher sem erro</text>
  <text x="390" y="178" font-family="Arial" font-size="18" fill="#64748b">Siga as etapas, confira os dados e envie somente quando estiver tudo certo.</text>
  <g transform="translate(390 230)">
    <g>
      <rect width="170" height="150" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="48" cy="46" r="24" fill="#2563eb"/>
      <text x="48" y="55" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#fff">1</text>
      <text x="28" y="98" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Escolha</text>
      <text x="28" y="126" font-family="Arial" font-size="16" fill="#64748b">Membro ou congregado</text>
    </g>
    <g transform="translate(205 0)">
      <rect width="170" height="150" rx="20" fill="#ecfdf5" stroke="#99f6e4"/>
      <circle cx="48" cy="46" r="24" fill="#0f766e"/>
      <text x="48" y="55" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#fff">2</text>
      <text x="28" y="98" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Preencha</text>
      <text x="28" y="126" font-family="Arial" font-size="16" fill="#64748b">Nome, contato e igreja</text>
    </g>
    <g transform="translate(410 0)">
      <rect width="170" height="150" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="48" cy="46" r="24" fill="#d97706"/>
      <text x="48" y="55" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#fff">3</text>
      <text x="28" y="98" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Anexe</text>
      <text x="28" y="126" font-family="Arial" font-size="16" fill="#64748b">Fotos e documentos</text>
    </g>
    <g transform="translate(615 0)">
      <rect width="170" height="150" rx="20" fill="#fef2f2" stroke="#fecaca"/>
      <circle cx="48" cy="46" r="24" fill="#dc2626"/>
      <text x="48" y="55" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#fff">4</text>
      <text x="28" y="98" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Assine</text>
      <text x="28" y="126" font-family="Arial" font-size="16" fill="#64748b">Aceite e envie</text>
    </g>
  </g>
  <rect x="390" y="450" width="748" height="120" rx="22" fill="#f8fbff" stroke="#d8e3f0"/>
  <text x="430" y="500" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">Antes de enviar</text>
  <text x="430" y="536" font-family="Arial" font-size="18" fill="#64748b">Confira documento, celular, endereco, assinatura e aceite de privacidade.</text>
</svg>
