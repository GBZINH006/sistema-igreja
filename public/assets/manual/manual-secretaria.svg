<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manual visual da secretaria</title>
  <desc id="desc">Resumo visual do painel da secretaria para documentação interna.</desc>
  <rect width="1200" height="720" rx="36" fill="#f8fbff"/>
  <rect x="76" y="76" width="1048" height="568" rx="32" fill="#ffffff" stroke="#d8e3f0"/>
  <text x="126" y="148" font-family="Arial" font-size="38" font-weight="800" fill="#0f172a">Secretaria</text>
  <text x="126" y="188" font-family="Arial" font-size="20" fill="#64748b">Busca controlada, conferencia e manutencao operacional.</text>
  <rect x="126" y="250" width="948" height="72" rx="18" fill="#eef3f8" stroke="#d8e3f0"/>
  <text x="162" y="295" font-family="Arial" font-size="22" fill="#64748b">Buscar por nome, CPF ou CRNM</text>
  <g transform="translate(126 374)">
    <rect width="280" height="150" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="28" y="62" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">Consultar</text>
    <text x="28" y="100" font-family="Arial" font-size="17" fill="#64748b">Visualizar ficha encontrada</text>
    <rect x="334" width="280" height="150" rx="20" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="362" y="62" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">Atualizar</text>
    <text x="362" y="100" font-family="Arial" font-size="17" fill="#64748b">Dados e anexos permitidos</text>
    <rect x="668" width="280" height="150" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="696" y="62" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">Imprimir</text>
    <text x="696" y="100" font-family="Arial" font-size="17" fill="#64748b">Ficha para conferencia</text>
  </g>
</svg>
