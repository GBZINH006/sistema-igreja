<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>AD Bela-Vista | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #07111f;
      --surface: #ffffff;
      --ink: #102033;
      --muted: #64748b;
      --gold: #c9a84c;
      --blue: #2563eb;
      --error: #dc2626;
      --border: #dbe4ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(120deg, rgba(7, 17, 31, 0.94), rgba(11, 25, 44, 0.86)), url("IMG_20260105_135803(1).jpg") center/cover fixed;
      color: var(--surface);
      font-family: "DM Sans", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    main {
      width: min(420px, 100%);
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      color: var(--ink);
    }

    .auth-header {
      padding: 32px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .auth-header img {
      width: 80px;
      height: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .auth-header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .auth-header p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .auth-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input::placeholder {
      color: var(--muted);
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background-color: rgba(220, 38, 38, 0.1);
      color: var(--error);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }

    .alert.success {
      background-color: rgba(5, 150, 105, 0.1);
      color: #059669;
      border: 1px solid rgba(5, 150, 105, 0.2);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .primary-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-footer {
      padding: 16px 28px;
      background: #f9fafb;
      text-align: center;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }

    .auth-footer a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .links {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .link-btn {
      flex: 1;
      padding: 10px;
      background: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      color: var(--muted);
    }

    .link-btn.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .link-btn:hover {
      border-color: var(--blue);
    }

    @media (max-width: 480px) {
      .auth-header {
        padding: 24px 20px 18px;
      }

      .auth-body {
        padding: 24px 20px;
      }

      .auth-header h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="auth-container">
      <div class="auth-header">
        <img src="images-removebg-preview.png" alt="Logo AD Bela-Vista">
        <h1>AD Bela-Vista</h1>
        <p>Acesse o painel administrativo</p>
      </div>

      <div class="auth-body">
        <div class="links">
          <button class="link-btn active" type="button" data-form="login">Login</button>
          <button class="link-btn" type="button" data-form="signup">Criar conta</button>
        </div>

        <div id="auth-alert" class="alert"></div>

        <!-- FORM LOGIN -->
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label for="login-email">E-mail</label>
            <input id="login-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label for="login-password">Senha</label>
            <input id="login-password" type="password" placeholder="Sua senha" required>
          </div>
          <button class="primary-btn" type="submit">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
          </button>
        </form>

        <!-- FORM SIGNUP -->
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label for="signup-name">Nome completo</label>
            <input id="signup-name" type="text" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label for="signup-email">E-mail</label>
            <input id="signup-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Senha</label>
            <input id="signup-password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <button class="primary-btn" type="submit">
            <i class="fa-solid fa-user-plus"></i> Criar conta
          </button>
        </form>
      </div>

      <div class="auth-footer">
        <small>Não é administrador? <a href="cadastro.html">Fazer cadastro aqui</a></small>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = window.CONFIG.SUPABASE_URL;
    const SUPABASE_KEY = window.CONFIG.SUPABASE_KEY;
    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const alertDiv = document.getElementById('auth-alert');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const formLinks = document.querySelectorAll('.link-btn');

    function showAlert(message, type = 'error') {
      alertDiv.textContent = message;
      alertDiv.className = `alert show ${type}`;
      setTimeout(() => alertDiv.classList.remove('show'), 5000);
    }

    // Tab switching
    formLinks.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const formType = e.target.dataset.form;
        formLinks.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');

        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        document.getElementById(`${formType}-form`).classList.add('active');
      });
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = loginForm.querySelector('button');

      btn.disabled = true;

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;

        showAlert('Login realizado! Redirecionando...', 'success');
        setTimeout(() => window.location.href = 'indicadores.html', 1500);
      } catch (error) {
        showAlert(error.message || 'Erro no login');
      } finally {
        btn.disabled = false;
      }
    });

    // Signup
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const btn = signupForm.querySelector('button');

      btn.disabled = true;

      try {
        const { data, error } = await db.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) throw error;

        showAlert('Conta criada! Você pode agora fazer login.', 'success');
        setTimeout(() => {
          document.querySelector('[data-form="login"]').click();
          document.getElementById('login-email').value = email;
        }, 1500);
      } catch (error) {
        showAlert(error.message || 'Erro na criação da conta');
      } finally {
        btn.disabled = false;
      }
    });

    // Check if already logged in
    (async () => {
      const { data } = await db.auth.getSession();
      if (data.session) window.location.href = 'indicadores.html';
    })();
  </script>
  <!-- Sistema de Proteção -->
  <script src="js/auth-guard.js"></script>

</body>

</html>
