<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Minha Área | AD Bela-Vista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../js/config.js"></script>
  <link rel="stylesheet" href="../css/membro.css">
</head>

<body>
  <div id="loading-view" class="loading-view">
    <div class="spinner"></div>
    <span>Carregando sua área...</span>
  </div>

  <div id="member-view" class="member-view hidden">
    <header class="topbar">
      <a class="brand" href="cadastro.html">
        <img src="../assets/images-removebg-preview.png" alt="Logo AD Bela-Vista">
        <span>AD Bela-Vista</span>
      </a>
      <div class="top-actions">
        <span id="member-email" class="member-email"></span>
        <button id="logout-btn" class="ghost-btn" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
      </div>
    </header>

    <main>
      <section class="hero-panel">
        <div class="profile-block">
          <label class="profile-photo" for="avatar-input" title="Alterar foto de perfil">
            <img id="avatar-img" alt="Foto do membro">
            <span id="avatar-fallback">MB</span>
            <i class="fa-solid fa-camera"></i>
          </label>
          <input id="avatar-input" type="file" accept="image/*" hidden>
        </div>
        <div class="hero-copy">
          <span class="eyebrow">Minha área</span>
          <h1 id="member-name">Olá</h1>
          <p>Cadastre seu perfil e acompanhe os registros enviados com esta conta.</p>
        </div>
        <a class="primary-btn" href="cadastro.html?origem=membro"><i class="fa-solid fa-id-card"></i> Cadastrar meu perfil</a>
      </section>

      <section class="content-panel profile-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow">Conta</span>
            <h2>Meus dados de acesso</h2>
          </div>
          <button id="save-profile-btn" class="ghost-btn" type="button"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
        <form class="profile-form" id="profile-form">
          <label>
            <span>Nome</span>
            <input id="profile-first-name" type="text" autocomplete="given-name">
          </label>
          <label>
            <span>Sobrenome</span>
            <input id="profile-last-name" type="text" autocomplete="family-name">
          </label>
          <label>
            <span>Telefone</span>
            <input id="profile-phone" type="tel" inputmode="tel" autocomplete="tel">
          </label>
          <label>
            <span>CPF</span>
            <input id="profile-cpf" type="text" disabled>
          </label>
        </form>
      </section>

      <section class="stats-grid" aria-label="Resumo dos cadastros">
        <article>
          <span>Total enviado</span>
          <strong id="stat-total">0</strong>
        </article>
        <article>
          <span>Membros</span>
          <strong id="stat-membros">0</strong>
        </article>
        <article>
          <span>Congregados</span>
          <strong id="stat-congregados">0</strong>
        </article>
      </section>

      <section class="content-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow">Histórico</span>
            <h2>Cadastros desta conta</h2>
          </div>
          <button id="refresh-btn" class="ghost-btn" type="button"><i class="fa-solid fa-rotate-right"></i> Atualizar</button>
        </div>
        <div id="member-alert" class="member-alert"></div>
        <div id="registrations-list" class="registrations-list"></div>
      </section>
    </main>
  </div>

  <div id="edit-overlay" class="edit-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <form id="edit-form" class="edit-modal">
      <div class="panel-head">
        <div>
          <span class="eyebrow">Ficha</span>
          <h2 id="edit-title">Editar cadastro</h2>
        </div>
        <button id="close-edit-btn" class="ghost-btn" type="button"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input id="edit-id" type="hidden">
      <div class="profile-form edit-form-grid">
        <label><span>Nome completo</span><input id="edit-nome" type="text"></label>
        <label><span>CPF/CRNM</span><input id="edit-cpf" type="text"></label>
        <label><span>Celular</span><input id="edit-celular" type="tel"></label>
        <label><span>E-mail</span><input id="edit-email" type="email"></label>
        <label><span>Data de nascimento</span><input id="edit-data-nasc" type="date"></label>
        <label><span>Estado civil</span><input id="edit-estado-civil" type="text"></label>
        <label><span>Cidade/Estado</span><input id="edit-cidade-estado" type="text"></label>
        <label><span>Setor/Congregação</span><input id="edit-setor" type="text"></label>
        <label><span>Forma de recebimento</span><input id="edit-forma" type="text"></label>
        <label class="wide"><span>Talentos e observações</span><textarea id="edit-talentos" rows="4"></textarea></label>
      </div>
      <div class="edit-actions">
        <button class="ghost-btn" type="button" id="cancel-edit-btn">Cancelar</button>
        <button class="primary-btn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Salvar ficha</button>
      </div>
    </form>
  </div>

  <script src="../js/membro.js"></script>
</body>

</html>
