<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Área do Membro | AD Bela-Vista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="membro-login.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-hero" aria-labelledby="auth-title">
      <a class="home-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Início</a>
      <img src="images-removebg-preview.png" alt="Logo AD Bela-Vista">
      <h1 id="auth-title">Área do Membro</h1>
      <p>Crie sua conta, entre com segurança e acompanhe os cadastros enviados por você.</p>
    </section>

    <section class="auth-card" aria-label="Acesso do membro">
      <div class="tabs" role="tablist" aria-label="Alternar acesso">
        <button class="tab active" type="button" data-tab="signup"><i class="fa-solid fa-user-plus"></i> Criar conta</button>
        <button class="tab" type="button" data-tab="login"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
      </div>

      <div id="auth-alert" class="auth-alert" aria-live="polite"></div>

      <form id="signup-form" class="auth-form active">
        <div class="form-grid two">
          <label>
            <span>Nome</span>
            <input id="signup-first-name" type="text" autocomplete="given-name" required>
          </label>
          <label>
            <span>Sobrenome</span>
            <input id="signup-last-name" type="text" autocomplete="family-name" required>
          </label>
        </div>
        <label>
          <span>E-mail</span>
          <input id="signup-email" type="email" autocomplete="email" required>
        </label>
        <div class="form-grid two">
          <label>
            <span>Telefone</span>
            <input id="signup-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(48) 99999-9999" required>
          </label>
          <label>
            <span>CPF</span>
            <input id="signup-cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
          </label>
        </div>
        <label>
          <span>Senha</span>
          <input id="signup-password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="primary-btn" type="submit"><i class="fa-solid fa-user-check"></i> Criar conta</button>
      </form>

      <form id="login-form" class="auth-form">
        <label>
          <span>E-mail</span>
          <input id="login-email" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar na minha área</button>
      </form>
    </section>
  </main>

  <script src="membro-login.js"></script>
</body>

</html>
